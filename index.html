<!doctype html>
<html lang="en">
<head>

<title>LAST LIGHT — Tactical Tug-of-War</title>
<style>
:root{color-scheme:dark;--ink:#191723;--muted:#a9a2b1;--gold:#ffcc78;--coral:#ff796f;--panel:rgba(25,23,35,.88)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#221d32;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;color:inherit}#game{position:relative;width:100%;height:100%;min-height:440px;overflow:hidden;background:#272139}.sky-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 36%,rgba(255,176,121,.12),transparent 46%);pointer-events:none}.topbar{position:absolute;z-index:5;left:0;right:0;top:0;height:76px;padding:12px clamp(14px,3vw,42px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(23,21,34,.86),rgba(23,21,34,.22));pointer-events:none}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:37px;height:37px;display:grid;place-items:center;border:1px solid rgba(255,204,120,.5);border-radius:11px;color:var(--gold);font-size:20px;box-shadow:inset 0 0 18px rgba(255,204,120,.1)}.brand-title{font-size:13px;font-weight:900;letter-spacing:.2em}.brand-sub{font-size:9px;color:#c3b9c6;letter-spacing:.16em;margin-top:3px}.battle-tag{border:1px solid rgba(255,255,255,.14);background:rgba(34,30,47,.48);padding:8px 13px;border-radius:20px;font-size:10px;letter-spacing:.15em;color:#e5c4b5}.battle-tag i{display:inline-block;width:6px;height:6px;background:#ff786e;border-radius:50%;margin-right:7px;box-shadow:0 0 9px #ff786e}.top-stats{display:flex;gap:10px}.stat-pill{min-width:105px;border:1px solid rgba(255,255,255,.12);background:rgba(29,25,42,.66);padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:9px}.stat-icon{color:var(--gold);font-size:17px}.stat-label{font-size:8px;letter-spacing:.16em;color:#aaa2b2}.stat-value{font-size:14px;font-weight:800;margin-top:1px}.field{position:absolute;inset:72px 0 156px;overflow:hidden}.field canvas{width:100%;height:100%;display:block}.field-vignette{position:absolute;inset:0;box-shadow:inset 0 -35px 70px rgba(21,19,30,.2);pointer-events:none}.deploy{position:absolute;z-index:5;bottom:0;left:0;right:0;min-height:156px;padding:12px clamp(14px,3vw,42px) max(13px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:clamp(9px,1.8vw,22px);background:linear-gradient(180deg,rgba(26,23,37,.8),rgba(22,20,31,.98) 24%);border-top:1px solid rgba(255,255,255,.1)}.deploy-label{position:absolute;left:clamp(14px,3vw,42px);top:15px;font-size:9px;color:#a8a1b0;letter-spacing:.18em;font-weight:800}.deploy-hint{position:absolute;right:clamp(14px,3vw,42px);top:15px;font-size:9px;color:#a8a1b0;letter-spacing:.06em}.unit-card{position:relative;width:min(220px,29vw);height:92px;margin-top:11px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(135deg,rgba(50,43,61,.96),rgba(34,30,45,.96));border-radius:12px;display:flex;align-items:center;padding:12px 14px;gap:13px;text-align:left;cursor:pointer;transition:transform .16s,border-color .16s,background .16s,opacity .16s;box-shadow:0 7px 18px rgba(0,0,0,.2)}.unit-card:hover:not(:disabled){transform:translateY(-3px);border-color:rgba(255,204,120,.62);background:linear-gradient(135deg,rgba(63,52,68,.98),rgba(38,33,48,.98))}.unit-card:active:not(:disabled){transform:translateY(0)}.unit-card:disabled{opacity:.52;cursor:not-allowed}.card-icon{flex:0 0 49px;height:49px;border-radius:10px;display:grid;place-items:center;background:rgba(255,204,120,.1);color:var(--gold)}.card-icon svg{width:38px;height:38px;fill:#08080d}.unit-info{min-width:0;display:block}.unit-name,.unit-desc,.unit-cost{display:block}.unit-name{font-size:13px;font-weight:850;letter-spacing:.04em}.unit-desc{font-size:9px;color:#aaa3b1;margin-top:4px;white-space:nowrap}.unit-cost{margin-top:7px;font-size:12px;color:var(--gold);font-weight:850}.unit-cost span{font-size:9px;color:#9993a2;font-weight:600;margin-left:4px}.hotkey{position:absolute;right:9px;top:8px;font-size:8px;color:#8f8998;border:1px solid rgba(255,255,255,.13);border-radius:4px;padding:2px 5px}.toast{position:absolute;z-index:6;left:50%;top:88px;transform:translate(-50%,-10px);padding:10px 15px;border:1px solid rgba(255,204,120,.36);border-radius:9px;background:rgba(29,25,41,.93);color:#ffe0ac;font-size:11px;letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}.result{position:absolute;z-index:8;inset:0;display:none;align-items:center;justify-content:center;background:rgba(19,17,28,.58);backdrop-filter:blur(5px)}.result.show{display:flex}.result-card{text-align:center;width:min(420px,calc(100vw - 32px));padding:36px 30px 30px;border:1px solid rgba(255,255,255,.17);border-radius:18px;background:linear-gradient(145deg,rgba(47,39,56,.98),rgba(27,24,38,.98));box-shadow:0 25px 80px rgba(0,0,0,.45)}.result-eyebrow{font-size:9px;letter-spacing:.26em;color:#c2b9c8}.result-title{font-size:clamp(42px,8vw,64px);line-height:1;font-weight:950;letter-spacing:.03em;margin:14px 0 10px}.result-title.win{color:var(--gold);text-shadow:0 0 30px rgba(255,204,120,.25)}.result-title.loss{color:var(--coral)}.result-copy{font-size:12px;color:#b9b1bf;line-height:1.6;margin-bottom:24px}.restart{border:0;border-radius:9px;background:var(--gold);color:#262033;font-weight:900;font-size:11px;letter-spacing:.1em;padding:13px 22px;cursor:pointer}.restart:hover{filter:brightness(1.08);transform:translateY(-1px)}.mobile-note{display:none}
@media(max-width:650px){.topbar{height:68px;padding-top:max(10px,env(safe-area-inset-top));align-items:flex-start}.brand{gap:8px}.brand-mark{width:31px;height:31px}.brand-title{font-size:11px}.brand-sub{font-size:8px}.battle-tag{display:none}.top-stats{gap:5px}.stat-pill{min-width:77px;padding:6px 8px;gap:6px}.stat-icon{font-size:14px}.stat-label{font-size:7px}.stat-value{font-size:12px}.field{inset:64px 0 152px}.deploy{min-height:152px;padding-left:9px;padding-right:9px;gap:7px;align-items:flex-end;padding-bottom:max(12px,env(safe-area-inset-bottom))}.deploy-label{left:12px;top:12px}.deploy-hint{right:12px;top:12px;font-size:8px}.unit-card{width:calc((100vw - 32px)/3);height:83px;padding:8px 7px;gap:6px;flex-direction:column;justify-content:center;align-items:flex-start;margin-top:10px}.card-icon{position:absolute;right:6px;top:9px;width:32px;height:32px;flex-basis:32px;border-radius:7px}.card-icon svg{width:26px;height:26px}.unit-name{font-size:11px}.unit-desc{font-size:8px;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis}.unit-cost{font-size:11px;margin-top:4px}.unit-cost span{font-size:8px}.hotkey{right:5px;top:auto;bottom:5px;font-size:7px}.field{bottom:152px}.toast{top:72px;font-size:10px;max-width:90vw;white-space:nowrap}.mobile-note{display:block;position:absolute;bottom:157px;left:50%;transform:translateX(-50%);z-index:2;font-size:8px;color:rgba(255,255,255,.45);letter-spacing:.08em;pointer-events:none}}
@media(max-height:520px){.field{top:58px;bottom:123px}.topbar{height:58px}.deploy{min-height:123px}.unit-card{height:72px}.mobile-note{display:none}}
</style>
</head>
<body>
<main id="game">
<div class="sky-glow"></div>
<header class="topbar">
  <div class="brand"><div class="brand-mark">✦</div><div><div class="brand-title">LAST LIGHT</div><div class="brand-sub">FRONTLINE COMMAND</div></div></div>
  <div class="battle-tag"><i></i> OPERATION: DUSKLINE</div>
  <div class="top-stats"><div class="stat-pill"><div class="stat-icon">◈</div><div><div class="stat-label">SUPPLY</div><div class="stat-value" id="money">$60</div></div></div><div class="stat-pill"><div class="stat-icon" style="color:#ff8981">♥</div><div><div class="stat-label">YOUR BASE</div><div class="stat-value" id="player-hp">100%</div></div></div></div>
</header>
<section class="field" aria-label="Battlefield"><canvas id="battle"></canvas><div class="field-vignette"></div></section>
<div class="mobile-note">DEPLOY UNITS · THEY FIGHT AUTOMATICALLY</div>
<div class="toast" id="toast"></div>
<section class="deploy" aria-label="Deploy units">
  <div class="deploy-label">DEPLOY SQUAD</div><div class="deploy-hint">UNITS FIGHT AUTOMATICALLY &nbsp;·&nbsp; 1 / 2 / 3</div>
  <button class="unit-card" data-unit="soldier" aria-label="Deploy Soldier for 20 dollars"><span class="hotkey">1</span><span class="card-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="23" cy="9" r="5"/><path d="M17 16h12l4 9-4 3-1 15h-6l-2-12-3 12h-6l4-16-5 3-5-8 3-2 5 5 3-9zm13 3 12 3-1 3-12-2z"/></svg></span><span class="unit-info"><span class="unit-name">Soldier</span><span class="unit-desc">Quick · light armor</span><span class="unit-cost">$20 <span>PER UNIT</span></span></span></button>
  <button class="unit-card" data-unit="tank" aria-label="Deploy Tank for 50 dollars"><span class="hotkey">2</span><span class="card-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 25h34l-3 11H10zM15 19h16l5 7H11zM21 15h9v5h-9zM28 16h16v3H28z"/><circle cx="16" cy="36" r="3"/><circle cx="25" cy="36" r="3"/><circle cx="34" cy="36" r="3"/></svg></span><span class="unit-info"><span class="unit-name">Tank</span><span class="unit-desc">Heavy · explosive</span><span class="unit-cost">$50 <span>PER UNIT</span></span></span></button>
  <button class="unit-card" data-unit="artillery" aria-label="Deploy Artillery for 80 dollars"><span class="hotkey">3</span><span class="card-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 28h23l6 7H7zM14 24h14l4 5H11zM18 19l17-10 2 3-18 12zM12 35l-4 9h3l6-9zm17 0 4 9h3l-2-9z"/><circle cx="20" cy="29" r="4"/></svg></span><span class="unit-info"><span class="unit-name">Artillery</span><span class="unit-desc">Siege · long range</span><span class="unit-cost">$80 <span>PER UNIT</span></span></span></button>
</section>
<section class="result" id="result" aria-live="assertive"><div class="result-card"><div class="result-eyebrow">OPERATION DUSKLINE</div><div class="result-title" id="result-title">VICTORY</div><div class="result-copy" id="result-copy">The enemy line has fallen. The last light is yours.</div><button class="restart" id="restart">↻ &nbsp; PLAY AGAIN</button></div></section>
</main>
<script>
const canvas=document.getElementById('battle'),ctx=canvas.getContext('2d');
const moneyEl=document.getElementById('money'),playerHpEl=document.getElementById('player-hp'),cards=[...document.querySelectorAll('.unit-card')],result=document.getElementById('result'),resultTitle=document.getElementById('result-title'),resultCopy=document.getElementById('result-copy'),toastEl=document.getElementById('toast');
const TYPES={soldier:{cost:20,hp:34,speed:57,range:145,damage:9,rate:.82,shotSpeed:430,kind:'bullet',size:1},tank:{cost:50,hp:145,speed:24,range:205,damage:27,rate:2.05,shotSpeed:290,kind:'shell',size:1.55,splash:62},artillery:{cost:80,hp:86,speed:13,range:365,damage:40,rate:3.1,shotSpeed:205,kind:'arc',size:1.35,splash:76}};
let w=0,h=0,dpr=1,units=[],shots=[],particles=[],texts=[],money=60,playerHp=100,enemyHp=100,elapsed=0,spawnTimer=5,finished=false,last=0,toastTimer=0,shake=0;
const groundY=()=>h*.82;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(resize).observe(canvas);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function baseX(team){return team? w-61:61}
function unitY(u){return groundY()-(u.type==='soldier'?31:u.type==='tank'?31:35)}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1500)}
function deploy(type){if(finished)return;const spec=TYPES[type];if(money<spec.cost){toast('Not enough supply — wait for the next drop.');return}if(units.filter(u=>u.team===0).length>=16){toast('Frontline is full.');return}money-=spec.cost;spawn(0,type);updateHud();}
function spawn(team,type){const spec=TYPES[type];units.push({id:Math.random(),team,type,hp:spec.hp,maxHp:spec.hp,x:team?baseX(1)-42:baseX(0)+42,cool:rand(.15,.55),anim:rand(0,6),flash:0})}
cards.forEach(b=>b.addEventListener('click',()=>deploy(b.dataset.unit)));
document.addEventListener('keydown',e=>{if(e.key==='1')deploy('soldier');if(e.key==='2')deploy('tank');if(e.key==='3')deploy('artillery');if((e.key==='r'||e.key==='R')&&finished)reset()});
document.getElementById('restart').addEventListener('click',reset);
function updateHud(){moneyEl.textContent='$'+Math.floor(money);playerHpEl.textContent=Math.max(0,Math.ceil(playerHp))+'%';playerHpEl.style.color=playerHp<30?'#ff8981':'';cards.forEach(b=>b.disabled=finished||money<TYPES[b.dataset.unit].cost)}
function endGame(win){if(finished)return;finished=true;resultTitle.textContent=win?'VICTORY':'DEFEAT';resultTitle.className='result-title '+(win?'win':'loss');resultCopy.textContent=win?'The enemy line has fallen. The last light is yours.':'Your stronghold has fallen. Regroup and try another strategy.';result.classList.add('show');updateHud()}
function reset(){units=[];shots=[];particles=[];texts=[];money=60;playerHp=100;enemyHp=100;elapsed=0;spawnTimer=4.5;finished=false;last=performance.now();result.classList.remove('show');updateHud();toast('Command ready. Hold the line.')}
function chooseTarget(u){const foes=units.filter(v=>v.team!==u.team&&v.hp>0).sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x));const foe=foes[0],dir=u.team? -1:1,range=TYPES[u.type].range;if(foe&&Math.abs(foe.x-u.x)<=range+14)return {unit:foe,x:foe.x,y:unitY(foe)-12};const bx=baseX(!u.team),dist=Math.abs(bx-u.x);if(dist<=range+58)return {base:!u.team,x:bx,y:groundY()-82};return null}
function fire(u,target){const spec=TYPES[u.type],direction=u.team?-1:1,fromX=u.x+direction*(u.type==='tank'?28:16),fromY=unitY(u)-(u.type==='soldier'?17:u.type==='tank'?32:28);const d=Math.abs(target.x-fromX),flight=spec.kind==='arc'?Math.max(.5,d/spec.shotSpeed):Math.max(.12,d/spec.shotSpeed);shots.push({team:u.team,kind:spec.kind,x:fromX,y:fromY,sx:fromX,sy:fromY,tx:target.x,ty:target.y,flight,age:0,targetUnit:target.unit,targetBase:target.base,damage:spec.damage,splash:spec.splash||0,dir:direction});u.cool=spec.rate;u.flash=.09}
function damageTarget(target,amount,team){if(target&&target.hp>0){target.hp=Math.max(0,target.hp-amount);target.flash=.14;if(target.hp<=0){burst(target.x,unitY(target),target.type==='tank'?15:9,'#ffb37b');if(target.team===0)shake=5}}}
function burst(x,y,count,color){for(let i=0;i<count;i++)particles.push({x,y,vx:rand(-72,72),vy:rand(-95,25),life:rand(.22,.62),max:.62,r:rand(1.3,3.8),color})}
function impact(s){const blast=s.kind==='shell'||s.kind==='arc',rad=s.splash;if(s.targetUnit&&s.targetUnit.hp>0)damageTarget(s.targetUnit,s.damage,s.team);if(rad){for(const u of units){if(u!==s.targetUnit&&u.team!==s.team&&u.hp>0&&Math.abs(u.x-s.tx)<rad)damageTarget(u,Math.max(4,s.damage*(1-Math.abs(u.x-s.tx)/rad)*.72),s.team)}}if(s.targetBase){if(s.targetBase===1){enemyHp=Math.max(0,enemyHp-s.damage);texts.push({x:s.tx,y:s.ty-20,value:'-'+s.damage,life:1.05,color:'#ffd18b'});if(enemyHp<=0)endGame(true)}else{playerHp=Math.max(0,playerHp-s.damage);texts.push({x:s.tx,y:s.ty-20,value:'-'+s.damage,life:1.05,color:'#ff8e86'});if(playerHp<=0)endGame(false)}}burst(s.tx,s.ty,blast?16:6,blast?'#ffb465':'#ffe6ad');if(blast)shake=Math.max(shake,2.4);updateHud()}
function roundRect(x,y,width,height,r){r=Math.min(r,width/2,height/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+width,y,x+width,y+height,r);ctx.arcTo(x+width,y+height,x,y+height,r);ctx.arcTo(x,y+height,x,y,r);ctx.arcTo(x,y,x+width,y,r);ctx.closePath()}
function update(dt){if(finished)return;elapsed+=dt;money+=10*dt;spawnTimer-=dt;if(spawnTimer<=0){const choices=['soldier','soldier','tank','artillery'];spawn(1,choices[Math.floor(Math.random()*choices.length)]);spawnTimer=rand(4,7)}
for(const u of units){u.cool-=dt;u.anim+=dt*8;u.flash=Math.max(0,u.flash-dt);const spec=TYPES[u.type],dir=u.team?-1:1,target=chooseTarget(u);const blocker=units.some(v=>v.team!==u.team&&v.hp>0&&Math.abs(v.x-u.x)<(u.type==='tank'?30:19));if(target){if(u.cool<=0)fire(u,target)}else if(!blocker)u.x+=dir*spec.speed*dt;u.x=Math.max(18,Math.min(w-18,u.x))}
for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.age+=dt;const t=Math.min(1,s.age/s.flight);s.x=s.sx+(s.tx-s.sx)*t;s.y=s.kind==='arc'?s.sy+(s.ty-s.sy)*t-Math.sin(t*Math.PI)*Math.min(105,Math.abs(s.tx-s.sx)*.28):s.sy+(s.ty-s.sy)*t;if(t>=1){impact(s);shots.splice(i,1)}}
for(let i=units.length-1;i>=0;i--)if(units[i].hp<=0)units.splice(i,1);
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=115*dt;if(p.life<=0)particles.splice(i,1)}
for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life-=dt;t.y-=22*dt;if(t.life<=0)texts.splice(i,1)}updateHud()}
function silhouette(points,color='#0b0a12'){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function drawCloud(x,y,s){ctx.fillStyle='rgba(48,39,56,.34)';ctx.beginPath();ctx.ellipse(x,y,52*s,10*s,0,0,Math.PI*2);ctx.ellipse(x-22*s,y-4*s,24*s,9*s,0,0,Math.PI*2);ctx.ellipse(x+13*s,y-8*s,31*s,12*s,0,0,Math.PI*2);ctx.fill()}
function drawLandscape(){const gy=groundY();const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#26223a');sky.addColorStop(.4,'#795066');sky.addColorStop(.72,'#e28b68');sky.addColorStop(1,'#f4b77a');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
const glow=ctx.createRadialGradient(w*.52,gy*.53,4,w*.52,gy*.53,h*.42);glow.addColorStop(0,'rgba(255,215,151,.56)');glow.addColorStop(.32,'rgba(255,177,128,.19)');glow.addColorStop(1,'rgba(255,165,120,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
ctx.fillStyle='#ffe2aa';ctx.globalAlpha=.88;ctx.beginPath();ctx.arc(w*.52,gy*.51,Math.min(45,w*.07),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// distant cloud bands and layered, static mountain silhouettes
for(let i=0;i<5;i++){const x=((i*197+60)%Math.max(w,1));drawCloud(x,h*(.18+(i%3)*.07),.7+(i%2)*.34)}
silhouette([[0,gy-92],[w*.08,gy-130],[w*.16,gy-98],[w*.27,gy-150],[w*.36,gy-96],[w*.49,gy-128],[w*.61,gy-88],[w*.72,gy-141],[w*.83,gy-102],[w*.93,gy-139],[w,gy-91],[w,gy],[0,gy]],'#33283b');
silhouette([[0,gy-52],[w*.12,gy-83],[w*.22,gy-57],[w*.32,gy-91],[w*.45,gy-53],[w*.58,gy-79],[w*.7,gy-48],[w*.82,gy-88],[w*.92,gy-55],[w,gy-71],[w,gy],[0,gy]],'#211d2b');
// silhouettes of ruined walls and sparse dead trees
const decor=[[w*.22,gy-31,.8],[w*.76,gy-27,.65],[w*.43,gy-20,.45]];for(const [x,y,s] of decor){ctx.save();ctx.translate(x,y);ctx.scale(s,s);silhouette([[0,0],[0,-25],[-7,-25],[-7,-43],[1,-43],[1,-34],[9,-34],[9,-52],[16,-52],[16,-22],[23,-22],[23,0]],'#171520');ctx.restore()}
for(let i=0;i<7;i++){const x=((i*83+18)%Math.max(w,1)),y=gy-80-(i%3)*25;ctx.strokeStyle='rgba(32,25,38,.68)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-6,y);ctx.quadraticCurveTo(x,y-5,x+6,y);ctx.stroke()}
// foreground earth and jagged edge
ctx.fillStyle='#100f17';ctx.fillRect(0,gy,w,h-gy);silhouette([[0,gy+4],[w*.1,gy-3],[w*.2,gy+2],[w*.31,gy-4],[w*.43,gy+3],[w*.57,gy-2],[w*.69,gy+3],[w*.81,gy-4],[w*.91,gy+2],[w,gy-2],[w,gy+11],[0,gy+11]],'#0c0b12');
ctx.strokeStyle='rgba(255,204,120,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,gy+11);ctx.lineTo(w,gy+11);ctx.stroke();
}
function drawBase(team){const x=baseX(team),gy=groundY(),left=team===0,hp=team?enemyHp:playerHp;ctx.save();ctx.translate(x,gy);ctx.scale(left?1:-1,1);ctx.fillStyle='#0a0910';
// blockhouse, crenellated towers, narrow windows
ctx.beginPath();ctx.moveTo(-44,0);ctx.lineTo(-40,-63);ctx.lineTo(-30,-63);ctx.lineTo(-30,-78);ctx.lineTo(-19,-78);ctx.lineTo(-19,-63);ctx.lineTo(-12,-63);ctx.lineTo(-9,-98);ctx.lineTo(9,-98);ctx.lineTo(12,-63);ctx.lineTo(20,-63);ctx.lineTo(20,-78);ctx.lineTo(31,-78);ctx.lineTo(31,-63);ctx.lineTo(41,-63);ctx.lineTo(45,0);ctx.closePath();ctx.fill();
ctx.fillRect(-53,-7,106,8);ctx.fillRect(-48,-24,96,7);ctx.fillRect(-14,-114,28,17);ctx.fillRect(-4,-128,8,14);
ctx.fillStyle='#f1ad6e';ctx.globalAlpha=.78;for(const xx of [-33,-8,18,34]){ctx.fillRect(xx,-49,3,11)}ctx.globalAlpha=1;
// flag
ctx.strokeStyle='#0a0910';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-128);ctx.lineTo(0,-151);ctx.stroke();ctx.fillStyle='#0a0910';ctx.beginPath();ctx.moveTo(1,-150);ctx.lineTo(17,-145);ctx.lineTo(1,-139);ctx.fill();ctx.restore();
const bw=74,bx=x-bw/2,by=gy-169;ctx.fillStyle='rgba(13,11,18,.62)';roundRect(bx-2,by-2,bw+4,10,5);ctx.fill();ctx.fillStyle='rgba(255,255,255,.2)';roundRect(bx,by,bw,6,3);ctx.fill();const grad=ctx.createLinearGradient(bx,0,bx+bw,0);grad.addColorStop(0,left?'#ffc878':'#ff9b7d');grad.addColorStop(1,left?'#ff8b76':'#ffbd78');ctx.fillStyle=grad;roundRect(bx,by,bw*Math.max(0,hp/100),6,3);ctx.fill();ctx.font='800 8px ui-sans-serif,system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(255,245,225,.82)';ctx.fillText(left?'YOUR STRONGHOLD':'ENEMY STRONGHOLD',x,by-6)}
function drawUnit(u){const gy=groundY(),y=unitY(u),scale=TYPES[u.type].size,dir=u.team?-1:1;ctx.save();ctx.translate(u.x,y);ctx.scale(dir*scale,scale);ctx.fillStyle='#08080e';if(u.flash>0){ctx.shadowColor='#ffd38d';ctx.shadowBlur=14}
if(u.type==='soldier'){const step=Math.sin(u.anim)*3;ctx.beginPath();ctx.arc(0,-22,5.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-5,-17);ctx.lineTo(5,-17);ctx.lineTo(7,-4);ctx.lineTo(3,0);ctx.lineTo(-6,0);ctx.closePath();ctx.fill();silhouette([[-4,-3],[-1,-3],[-3,9+step],[-8,10+step],[-8,7+step]],'#08080e');silhouette([[2,-4],[6,-4],[10,7-step],[7,10-step],[2,1]],'#08080e');ctx.beginPath();ctx.moveTo(2,-14);ctx.lineTo(13,-15);ctx.lineTo(15,-13);ctx.lineTo(3,-10);ctx.fill();ctx.fillRect(8,-18,13,2.4);ctx.fillRect(19,-19,4,1.5)}
else if(u.type==='tank'){ctx.beginPath();ctx.moveTo(-23,-4);ctx.lineTo(-19,-14);ctx.lineTo(15,-14);ctx.lineTo(22,-5);ctx.lineTo(20,0);ctx.lineTo(-23,0);ctx.closePath();ctx.fill();ctx.beginPath();ctx.ellipse(-1,-16,11,7,0,Math.PI,0);ctx.fill();ctx.fillRect(0,-19,26,3);ctx.fillRect(22,-20,5,1.5);ctx.fillRect(-20,-2,42,5);for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(-15+i*8,1,2.5,0,Math.PI*2);ctx.fill()}}
else{ctx.fillRect(-21,-7,37,5);ctx.fillRect(-17,-13,27,6);ctx.beginPath();ctx.arc(-4,-13,5,Math.PI,0);ctx.fill();ctx.save();ctx.translate(0,-15);ctx.rotate(-.43);ctx.fillRect(0,-2,27,4);ctx.restore();ctx.beginPath();ctx.arc(16,-2,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-15,-1,3,0,Math.PI*2);ctx.fill()}
ctx.restore();if(u.hp<u.maxHp){const ww=u.type==='tank'?39:28,yy=y-(u.type==='soldier'?34:39);ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(u.x-ww/2,yy,ww,3);ctx.fillStyle='#ffc678';ctx.fillRect(u.x-ww/2,yy,ww*Math.max(0,u.hp/u.maxHp),3)}
}
function drawShots(){for(const s of shots){if(s.kind==='arc'){ctx.strokeStyle='rgba(255,193,118,.2)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(s.sx,s.sy);ctx.quadraticCurveTo((s.sx+s.tx)/2,(s.sy+s.ty)/2-75,s.x,s.y);ctx.stroke();ctx.fillStyle='#ffd38b';ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,177,100,.42)';ctx.beginPath();ctx.arc(s.x,s.y,8,0,Math.PI*2);ctx.fill()}
else{ctx.strokeStyle=s.kind==='shell'?'#ffab70':'#fff0bd';ctx.lineWidth=s.kind==='shell'?3:2;ctx.beginPath();ctx.moveTo(s.x-s.dir*(s.kind==='shell'?12:7),s.y);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.fillStyle=s.kind==='shell'?'#ffb36b':'#fff1c4';ctx.beginPath();ctx.arc(s.x,s.y,s.kind==='shell'?2.8:1.8,0,Math.PI*2);ctx.fill()}}}
function drawEffects(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(.35,p.life/p.max),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const t of texts){ctx.globalAlpha=Math.min(1,t.life*1.6);ctx.fillStyle=t.color;ctx.font='900 13px ui-sans-serif,system-ui';ctx.textAlign='center';ctx.shadowColor='#211a26';ctx.shadowBlur=5;ctx.fillText(t.value,t.x,t.y);ctx.shadowBlur=0}ctx.globalAlpha=1}
function render(){ctx.clearRect(0,0,w,h);drawLandscape();ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake=Math.max(0,shake-.12)}drawBase(0);drawBase(1);for(const u of units)drawUnit(u);drawShots();drawEffects();ctx.restore()}
function frame(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(!finished)update(dt);render();requestAnimationFrame(frame)}
reset();requestAnimationFrame(frame);
